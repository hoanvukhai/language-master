<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient: Vibrant Blue to Indigo to Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- White Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)"/>

  <!-- Inner Gloss Border -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Open Knowledge Book Wings -->
  <g filter="url(#glow)">
    <!-- Left Page -->
    <path d="M26 84 C26 56, 44 48, 60 48 C61.5 48, 62 50, 62 52 L62 94 C62 95.5, 60.5 95.5, 59 95.5 C45 95.5, 33 100, 26 104 Z" fill="url(#pageGrad)"/>
    
    <!-- Right Page -->
    <path d="M102 84 C102 56, 84 48, 68 48 C66.5 48, 66 50, 66 52 L66 94 C66 95.5, 67.5 95.5, 69 95.5 C83 95.5, 95 100, 102 104 Z" fill="url(#pageGrad)"/>

    <!-- Spine / Center Pillar -->
    <rect x="62.5" y="49" width="3" height="46" rx="1.5" fill="#c7d2fe"/>

    <!-- Subtle text line markings on pages -->
    <path d="M36 65 Q46 62 54 62" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M36 75 Q46 72 54 72" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M74 62 Q82 62 92 65" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M74 72 Q82 72 92 75" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 4-Point Rising Star of Mastery -->
  <path d="M64 16 Q64 30 78 30 Q64 30 64 44 Q64 30 50 30 Q64 30 64 16 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Mini Accent Sparkle -->
  <circle cx="86" cy="24" r="3" fill="#fde047" opacity="0.9"/>
</svg>